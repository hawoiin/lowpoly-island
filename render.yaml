services:
  - type: web
    name: lowpoly-island-multiplayer
    runtime: node
    plan: free
    rootDir: lowpoly-island-v28-render-deploy
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_PLAYERS
        value: "16"
