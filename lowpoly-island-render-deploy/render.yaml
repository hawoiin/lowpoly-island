services:
  - type: web
    name: lowpoly-island-multiplayer
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_PLAYERS
        value: "16"
      - key: FREE_PLAN_MODE
        value: "1"
      - key: FREE_WORLD_SEED
        value: "24101986"
